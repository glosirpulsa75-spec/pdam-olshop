<input type="text" id="penangkapKontakServer" class="{{hasil_kontak}}" style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0.01; pointer-events:none; z-index:-1;">

<div id="app">Memuat halaman...</div>

<script>
  // Simpan alamat URL asli halaman BukaOlshop sebelum di-reset oleh document.open()
  const urlAsliHalaman = window.location.href;
  const judulHalaman = "Pulsa Crom";
  const penangkapKontak = document.getElementById('penangkapKontakServer');

  fetch('https://glosirpulsa75-spec.github.io/pdam-olshop/mobile_legend.html')
    .then(res => res.text())
    .then(html => {
      document.open();
      document.write(html);
      document.close();

      // Kembalikan URL asli & judul agar WebView tidak pernah menampilkan about:blank
      try {
        window.history.replaceState(null, judulHalaman, urlAsliHalaman);
      } catch (e) {}
      document.title = judulHalaman;

      setTimeout(() => {
        document.title = judulHalaman;
        document.body.appendChild(penangkapKontak);
        let nilaiKontakSebelumnya = '';

        setInterval(() => {
          if (document.title !== judulHalaman) {
            document.title = judulHalaman;
          }

          if (penangkapKontak.value && penangkapKontak.value !== nilaiKontakSebelumnya) {
            nilaiKontakSebelumnya = penangkapKontak.value;
            
            let nomorBersih = nilaiKontakSebelumnya.replace(/[^0-9]/g, '');
            if (nomorBersih.startsWith('62')) {
              nomorBersih = '0' + nomorBersih.slice(2);
            }

            const inputUtama = document.getElementById('scanner-input') || document.querySelector('input[placeholder*="Nomor"]');
            if (inputUtama) {
              inputUtama.value = nomorBersih;
              inputUtama.dispatchEvent(new Event('input', { bubbles: true }));
              inputUtama.dispatchEvent(new Event('change', { bubbles: true }));
              inputUtama.dispatchEvent(new Event('keyup', { bubbles: true }));
            }
          }
        }, 250);
      }, 300);
    });
</script>
